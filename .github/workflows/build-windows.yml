name: Build Windows EXE

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-and-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt tzdata
      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q
      - name: Build EXE
        run: pyinstaller --noconfirm --clean packaging/InvestorHelper.spec
      - name: Smoke-test the EXE starts
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\InvestorHelper.exe -PassThru
          Start-Sleep -Seconds 20
          if ($p.HasExited) { throw "EXE exited early with code $($p.ExitCode)" }
          Stop-Process -Id $p.Id -Force
      - uses: actions/upload-artifact@v4
        with:
          name: InvestorHelper-windows
          path: dist/InvestorHelper.exe
      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/InvestorHelper.exe
